<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Mediary — Injection Tracker</title>
<style>
:root{--background:#F7F3EC;--surface:#FFFFFF;--text-primary:#2B2A28;--text-secondary:#6B6660;--accent:#6E8F7A;--accent-strong:#54705F;--accent-soft:#E3ECE4;--divider:#E5DFD3}
*{box-sizing:border-box}
body{margin:0;background:var(--background);color:var(--text-primary);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.6}
.wrap{max-width:720px;margin:0 auto;padding:40px 20px 72px}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:24px}
.brand-mark{width:40px;height:40px;border-radius:12px;background:var(--accent-soft);display:flex;align-items:center;justify-content:center;font-size:20px}
.brand-name{font-size:20px;font-weight:600}
.doc{background:var(--surface);border-radius:16px;padding:24px}
h1{font-size:26px;margin:0 0 12px}
h2{font-size:19px;margin:28px 0 8px}
h3{font-size:16px;margin:20px 0 6px}
a{color:var(--accent-strong)}
hr{border:none;border-top:1px solid var(--divider);margin:24px 0}
ul,ol{padding-left:22px}
li+li{margin-top:4px}
table{border-collapse:collapse;width:100%;font-size:14px;display:block;overflow-x:auto}
th,td{border:1px solid var(--divider);padding:8px;text-align:left;vertical-align:top}
th{background:var(--accent-soft)}
footer{margin-top:32px;color:var(--text-secondary);font-size:13px;text-align:center}
.links{list-style:none;padding:0}
.links li{margin:0 0 12px}
.links a{font-weight:600}

</style>
</head>
<body>
<div class="wrap">
<div class="brand"><div class="brand-mark">🌿</div><div class="brand-name">Mediary</div></div>
<article class="doc">
<h1>Mediary — Injection Tracker</h1>
<p>Mediary helps you record and organise your own injection information.</p>

<li><a href="privacy.html">Privacy Policy</a></li>
<li><a href="terms.html">Terms of Use</a></li>
<li><a href="delete-account/">Delete your account and data</a></li>
</ul>
<p>Contact: <a href="mailto:help@artifactai.co.nz">help@artifactai.co.nz</a></p>
</article>
</div>
</body>
</html>
